LogLevel warn
MaxLogSize 1048576
PageLogFormat
Port 631
Listen /run/cups/cups.sock
ServerName green-printer.local
ServerAlias green-printer.local localhost
Browsing Yes
BrowseLocalProtocols dnssd
DefaultShared Yes
DefaultEncryption IfRequested
DefaultAuthType Basic
WebInterface No
ErrorPolicy retry-job
DirtyCleanInterval 0

<Location />
  Order allow,deny
  Allow @LOCAL
  Allow localhost
</Location>

<Location /admin>
  Order allow,deny
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order allow,deny
    Allow @LOCAL
    Allow localhost
  </Limit>
  <Limit Send-Document Send-URI Cancel-Job Cancel-My-Jobs Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Close-Job CUPS-Move-Job>
    Require user @OWNER @SYSTEM
    Order allow,deny
    Allow @LOCAL
    Allow localhost
  </Limit>
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow localhost
  </Limit>
  <Limit CUPS-Get-Document>
    AuthType Default
    Require user @OWNER @SYSTEM
    Order allow,deny
    Allow localhost
  </Limit>
  <Limit All>
    Order allow,deny
    Allow @LOCAL
    Allow localhost
  </Limit>
</Policy>
